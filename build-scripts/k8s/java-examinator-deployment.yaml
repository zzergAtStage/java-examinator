apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-examinator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-examinator
  template:
    metadata:
      labels:
        app: java-examinator
    spec:
      containers:
        - name: java-examinator
          image: ${DOCKER_REGISTRY}/${APP_NAME}:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "200m"