<!DOCTYPE html>
<!--  submission.html  -->
<!--  Review page that now supports both choice‑based and free‑text (input) answers.            -->
<!--  Architecture:                                                                             -->
<!--  * renderPage()   – entry point executed on DOMContentLoaded                               -->
<!--  * buildQuestionBlock() – delegates to specific builder per question.kind                 -->
<!--  * buildChoiceBlock()  – renders radio / checkbox answers and highlighting                -->
<!--  * buildInputBlock()   – renders read‑only input field showing the user’s text            -->
<!--  All helper functions are pure (return HTML strings) and use descriptive constant names. -->
<html lang="en" class="h-100">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Quiz — Submission Review</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Prism.js for code formatting -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css"
      rel="stylesheet"
    />

    <style>
      /* ==== Layout ============================================================= */
      .scrollable-question-container {
        max-height: 600px;
        overflow-y: auto;
        padding: 1rem;
        border: 1px solid #ced4da;
        border-radius: 0.5rem;
        background-color: #f8f9fa;
      }
      .ques-box {
        margin-bottom: 1.5rem;
        padding: 1rem;
        background-color: #343a40;
        color: #fff;
        border-radius: 0.5rem;
      }
      .choice-container,
      .input-container {
        margin-bottom: 0.75rem;
      }

      /* ==== Highlighting ======================================================== */
      .correct-answer {
        border: 2px solid #198754; /* Bootstrap green */
        border-radius: 0.5rem;
      }
      .wrong-answer {
        border: 2px solid #dc3545; /* Bootstrap red */
        border-radius: 0.5rem;
      }
      .explanation {
        margin-top: 0.5rem;
        color: #ffc107; /* Bootstrap yellow */
      }
      input[disabled] {
        background: #e9ecef;
      }
    </style>
  </head>

  <body class="d-flex flex-column h-100">
    <!-- Navbar (Thymeleaf fragment) -->
    <div th:replace="~{navbar.html :: navbar}"></div>

    <main class="container py-5 px-4 flex-grow-1">
      <h1 class="bg-warning p-2">Review Your Answers</h1>

      <form id="quizForm" class="mt-3">
        <div id="question-container" class="scrollable-question-container"></div>

        <div class="mt-4">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="window.location.href='/submissions'"
          >
            Dismiss
          </button>
        </div>
      </form>
    </main>

    <!-- Footer (Thymeleaf fragment) -->
    <div th:replace="~{footer.html :: footer}"></div>

    <!-- ===== Scripts =========================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

    <script type="module">
      /**
       * entry point: renders all questions once DOM is ready.                              
       * Keeps ZERO mutable globals – only constants & function scope variables.           
       */
      document.addEventListener('DOMContentLoaded', renderPage);

      /**
       * Loads exam data, flattens sections and renders blocks.                            
       * Adheres to SRP by delegating actual HTML generation to helper builders.           
       */
      function renderPage() {
        const examData = JSON.parse(document.getElementById('questionData').textContent);
        const allQuestions = examData.sections.flatMap((s) => s.questions);
        const container = document.getElementById('question-container');

        allQuestions
          .map(buildQuestionBlock)
          .forEach((html) => (container.innerHTML += html));

        Prism.highlightAll();
      }

      /**
       * Builds a single question block, delegating by questionType.                       
       * @param {Object} q – wrapper holding .question & user / correct answers            
       * @returns {string} fully‑styled HTML string                                        
       */
      function buildQuestionBlock(q) {
        const { question } = q;
        const header = `<p class="title">${question.questionHeader}</p>`;

        const body =
          question.questionType === 'INPUT'
            ? buildInputBlock(q)
            : buildChoiceBlock(q);

        return `<div class="ques-box">${header}${body}</div>`;
      }

      /**
       * Renders choice‑based questions (single or multiple).                              
       * Highlights user selection vs. correctness.                                        
       */
      function buildChoiceBlock({ question, userAnswers, correctAnswers }) {
        const codeOrText =
          question.questionType === 'CODE'
            ? `<pre><code class="language-java">${question.questionText}</code></pre>`
            : `<p>${question.questionText}</p>`;

        const choiceHtml = question.choices
          .map((choice) => {
            const isUser = userAnswers.includes(choice);
            const isCorrect = correctAnswers.includes(choice);
            const highlightClass = isUser
              ? isCorrect
                ? 'correct-answer'
                : 'wrong-answer'
              : isCorrect
              ? 'correct-answer'
              : '';

            const radio = `<input type="radio" disabled ${isUser ? 'checked' : ''}>`;
            return `<div class="choice-container ${highlightClass}"><label>${radio} ${choice}</label></div>`;
          })
          .join('');

        return `${codeOrText}<hr/>${choiceHtml}`;
      }

      /**
       * Renders free‑text / input‑based answers.                                          
       * Shows the user’s answer in a disabled field and optionally marks correctness.     
       */
      function buildInputBlock({ question, userAnswers, correctAnswers }) {
        const userValue = userAnswers?.[0] ?? '';
        const isCorrect = correctAnswers?.[0] === userValue;
        const highlightClass = isCorrect ? 'correct-answer' : 'wrong-answer';

        return `
          <p>${question.questionText}</p>
          <hr/>
          <div class="input-container ${highlightClass}">
            <label class="form-label">Your answer:</label>
            <input type="text" class="form-control" value="${userValue}" disabled />
          </div>
          ${!isCorrect && question.correctAnswerExplanation ? buildExplanation(question.correctAnswerExplanation) : ''}
        `;
      }

      /** Returns formatted explanation block. */
      function buildExplanation(text) {
        return `<div class="explanation"><strong>Explanation:</strong> ${text}</div>`;
      }
    </script>

    <!-- Hidden JSON data injected by the server (Thymeleaf) -->
    <script type="application/json" id="questionData" th:inline="javascript">
      /*[[${qForm}]]*/
    </script>
  </body>
</html>
