<!DOCTYPE html>
<html class="h-100" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Page</title>

  <!-- <link rel="stylesheet" th:href="@{/css/quiz.css}"> -->
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Prism.js for code formatting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/themes/prism-okaidia.min.css" rel="stylesheet" />
</head>
<!-- Importing NavBar -->
<nav th:replace="~{navbar.html :: navbar}"></nav>

<body class="d-flex flex-column min-vh-100">

  <div class="main-container container py-5 px-4">
    <h1 class="bg-warning p-3">Answer the Questions Below</h1>

    <!-- The main form for quiz submission -->
    <form id="quizForm">
      <div id="question-container"></div>
      <div class="mt-4">
        <button type="button" id="prevButton" class="btn btn-secondary" disabled>Previous</button>
        <button type="button" id="nextButton" class="btn btn-primary">Next</button>
        <button type="submit" id="submitButton" class="btn btn-success d-none">Submit Quiz</button>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Core scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/components/prism-java.min.js"></script>
  
  <!-- Refactored quiz logic -->
  <script type="module" src="/script/quizManager.js"></script>
  <!-- Hidden data for questions (populated by your server template) -->

  <!-- Hidden data for questions (populated by Thymeleaf) -->
  <script type="application/json" id="questionData" th:inline="javascript">
    /*[[${qForm}]]*/
  </script>
</body>

<!-- Importing Footer -->
<footer th:replace="~{footer.html :: footer}"></footer>

</html>
