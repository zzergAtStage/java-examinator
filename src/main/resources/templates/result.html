<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/result.css}">
  <title>Result Page</title>
</head>
<body>

<!-- Importing NavBar -->
<div th:insert="~{navbar.html :: navbar}"></div>

<!-- Main Container Start -->
<div class="main-container container py-5 px-4">
  <div class="card bg-dark text-light py-5 px-4 mx-auto">
    <img th:src="@{/images/exam.svg}" alt="image">

    <h3 class="bg-danger text-center mb-5 p-2">Your Score</h3>

    <div class="d-flex justify-content-center">
      <p>Participant name:&nbsp;&nbsp;</p>
      <p id="username">user</p>
      <!-- <p th:text="${username}">user</p> -->
    </div>

    <div class="d-flex justify-content-center">
      <p>Total score:&nbsp;&nbsp;</p>
      <p id="totalScore">0</p>
      <!-- <p th:if="${totalScore}" th:text="${totalScore}"></p> -->
    </div>
    <div class="d-flex justify-content-center">
      <p>Total answered:&nbsp;&nbsp;</p>
      <p id="totalAnswered">0</p>
      <!-- <p th:if="${totalScore}" th:text="${totalAnswered}"></p> -->
    </div>

    <div class="d-flex justify-content-center">
      <p>Total false answer:&nbsp;&nbsp;</p>
      <p id = "totalFalseAnswered">0</p>
      <!-- <p th:if="${totalAnswered}" th:text="${totalAnswered}"></p> -->
    </div>

    <div class="d-flex justify-content-center mt-4">
      <button type="button" th:onclick="window.location.href='/submissions'"
              class="btn btn-outline-warning mx-auto">Review submits</button>
      <button type="button" th:onclick="window.location.href='/'"
              class="btn btn-outline-warning mx-auto">Back to Homepage</button>
    </div>
  </div>
</div>

<!-- Importing Footer -->
<footer th:replace="~{footer.html :: footer}"></footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
  const result = JSON.parse(sessionStorage.getItem('submissionResult'));
  document.getElementById('totalScore').innerText = result.totalScore;
  document.getElementById('totalAnswered').innerText = result.totalAnswered;
  document.getElementById('totalFalseAnswered').innerText = result.totalFalseAnswered;
  document.getElementById('username').innerText = result.participantName;
});

</script>

</body>
</html>
